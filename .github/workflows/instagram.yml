name: Instagram

on:
  schedule:
    - cron: "40 8 * * *"
    - cron: "10 10 * * *"
    - cron: "40 11 * * *"
    - cron: "10 13 * * *"
    - cron: "10 14 * * *"
    - cron: "50 14 * * *"
    - cron: "50 17 * * *"
    - cron: "40 20 * * *"
    - cron: "10 23 * * *"
    - cron: "40 0 * * *"
  push:
    branches: [main]
    paths: [docs/marca/instagram/automatico/pedido.json]
  workflow_dispatch:
    inputs:
      slot:
        description: "O que publicar"
        type: choice
        options: [evangelho, data, santos, novena, reflexao, angelus, misericordia, curiosidade, terco, noite]
        required: true
      data:
        description: "AAAA-MM-DD (vazio = hoje em Brasília)"
        required: false
      teste:
        description: "Só conferir, sem publicar"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: O que e quando
        id: h
        run: |
          s="${{ inputs.slot }}"; d="${{ inputs.data }}"; t="${{ inputs.teste }}"; c=""
          case "${{ github.event_name }}" in
            push)
              p=docs/marca/instagram/automatico/pedido.json
              s=$(jq -r '.slot // ""' $p); d=$(jq -r '.data // ""' $p); t=$(jq -r 'if .teste == false then "false" else "true" end' $p) ;;
            schedule)
              c="${{ github.event.schedule }}"; t=false ;;
          esac
          [ -z "$d" ] && d=$(TZ=America/Sao_Paulo date +%F)
          { echo "slot=$s"; echo "cron=$c"; echo "data=$d"; echo "teste=$t"; } >> "$GITHUB_OUTPUT"
          echo "Slot: ${s:-pelo horário ($c)} · Data: $d · Teste: $t"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Imagens do dia
        env:
          D: ${{ steps.h.outputs.data }}
        run: |
          git config --global user.name "Minha Igrejinha"
          git config --global user.email "minhaigrejinha@users.noreply.github.com"
          anterior=""
          if git fetch --depth 1 origin instagram 2>/dev/null; then anterior=$(git rev-parse FETCH_HEAD); fi
          if [ -n "$anterior" ] && git cat-file -e "$anterior:$D/dia.json" 2>/dev/null; then
            git worktree add --detach .ig "$anterior"
            exit 0
          fi
          npm ci
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
          node scripts/instagram/gerar-do-dia.mjs "$D" ".ig-novo/$D"
          limite=$(TZ=America/Sao_Paulo date -d "7 days ago" +%F)
          git worktree add --orphan -b instagram .ig
          if [ -n "$anterior" ]; then
            for p in $(git ls-tree --name-only "$anterior"); do
              if [[ "$p" > "$limite" || "$p" == "$limite" ]] && [ "$p" != "$D" ]; then git -C .ig checkout "$anterior" -- "$p"; fi
            done
          fi
          cp -r ".ig-novo/$D" .ig/
          git -C .ig add -A
          git -C .ig commit -qm "Instagram: $D"
          git -C .ig push -f origin HEAD:refs/heads/instagram

      - name: Publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          a=(--dia ".ig/${{ steps.h.outputs.data }}" --data "${{ steps.h.outputs.data }}")
          if [ -n "${{ steps.h.outputs.slot }}" ]; then a+=(--slot "${{ steps.h.outputs.slot }}"); else a+=(--cron "${{ steps.h.outputs.cron }}"); fi
          [ "${{ steps.h.outputs.teste }}" = "true" ] && a+=(--teste)
          node scripts/instagram/publicar.mjs "${a[@]}"

      - name: Registrar
        if: always()
        run: |
          if [ -d .ig ] && [ -n "$(git -C .ig status --porcelain)" ]; then
            git -C .ig add -A
            git -C .ig commit -qm "Instagram: publicado ${{ steps.h.outputs.data }} ${{ steps.h.outputs.slot }}${{ steps.h.outputs.cron }}"
            git -C .ig push origin HEAD:refs/heads/instagram
          fi

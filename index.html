<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%VITE_NOME_DO_APP%</title>
    <meta name="description" content="Liturgia diária, terço, Bíblia e orações. Gratuito e sem anúncios." />
    <meta name="theme-color" content="#FBF0DD" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-santinho-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      try {
        var p = JSON.parse(localStorage.getItem("santinho-preferencias") || "{}");
        var r = document.documentElement;
        var escuro = p.tema === "escuro" || (p.tema !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches);
        r.dataset.tema = escuro ? "escuro" : "claro";
        r.dataset.letra = p.letra || "normal";
        if (p.simples) r.dataset.simples = "1";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var erros = [];
        window.addEventListener("error", function (e) {
          erros.push((e.message || "erro") + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : ""));
        });
        window.addEventListener("unhandledrejection", function (e) {
          erros.push("promessa: " + (e.reason && (e.reason.message || e.reason)));
        });
        window.__recarregarApp = function () {
          var feito = function () { location.replace("/?r=" + Date.now()); };
          try {
            var passos = [];
            if (navigator.serviceWorker) passos.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
            if (window.caches) passos.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
            Promise.all(passos).then(feito, feito);
          } catch (e) { feito(); }
        };
        setTimeout(function () {
          var raiz = document.getElementById("root");
          if (!raiz || raiz.children.length) return;
          raiz.innerHTML =
            '<div style="font-family:-apple-system,system-ui,sans-serif;padding:48px 24px;max-width:28rem;margin:0 auto;color:#341E0D;background:#FBF0DD;min-height:100vh;box-sizing:border-box">' +
            '<p style="font-size:20px;font-weight:600;margin:0 0 12px">O app não abriu.</p>' +
            '<button onclick="window.__recarregarApp()" style="font-size:17px;font-weight:600;padding:14px 20px;border-radius:14px;border:0;background:#C9A13B;color:#2A1A0A;width:100%">Recarregar o app</button>' +
            '<p style="font-size:13px;opacity:.7;margin-top:20px;word-break:break-word">' + (erros.length ? erros.slice(0, 3).join("<br>").replace(/</g, "&lt;").replace(/&lt;br>/g, "<br>") : "sem erro registrado") + " · " + navigator.userAgent.replace(/</g, "") + "</p></div>";
        }, 6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
